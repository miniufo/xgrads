[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [".ipynb_checkpoints"]

[tool.ruff.lint]
select = ["E9", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# every import in __init__.py is a deliberate public re-export,
# e.g. ``from xgrads import CtlDescriptor``; adding __all__ instead
# would make autodoc document each name twice.
"xgrads/__init__.py" = ["F401"]

[tool.coverage.run]
source = ["xgrads"]

[tool.coverage.report]
show_missing = true
skip_covered = true
